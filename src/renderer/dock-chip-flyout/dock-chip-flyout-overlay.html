<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    font-family: "Segoe UI", system-ui, sans-serif;
  }

  #host {
    width: 100%;
    height: 100%;
    box-sizing: border-box;
    padding-bottom: 20px;
    display: flex;
    align-items: flex-start;
    justify-content: center;
  }

  #host.mode-more {
    padding-bottom: 12px;
    justify-content: flex-end;
  }

  .flyout {
    position: relative;
    display: flex;
    flex-direction: column;
    width: 168px;
    padding: 4px 0;
    border-radius: 14px;
    background: rgba(28, 32, 40, 0.96);
    border: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
    color: #f2f5fa;
    overflow: visible;
  }

  .flyout::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 100%;
    transform: translateX(-50%);
    border: 7px solid transparent;
    border-top-color: rgba(28, 32, 40, 0.96);
  }

  .more-panel {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 220px;
    max-width: 280px;
    max-height: 280px;
    overflow-x: hidden;
    overflow-y: auto;
    padding: 8px;
    border-radius: 12px;
    background: #1e2430;
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
    color: #f2f5fa;
  }

  .dock-device-chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    border-radius: 10px;
    padding: 6px 8px;
    box-sizing: border-box;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
  }

  .dock-device-chip.has-device-color {
    border-color: var(--device-chip-color);
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--device-chip-color) 35%, transparent);
  }

  .dock-device-chip-name {
    max-width: 110px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 11px;
    font-weight: 500;
    color: #c5cdd9;
  }

  .dock-device-chip-controls {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin-left: auto;
  }

  .dock-battery-item {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-weight: 600;
    color: #8b93a3;
    line-height: 1;
  }

  .dock-battery-icon {
    width: 16px;
    height: 16px;
    display: block;
    flex-shrink: 0;
  }

  .dock-battery-item.dock-battery-good,
  .dock-battery-item.dock-battery-good .dock-battery-fill { color: #3ecf6f; }
  .dock-battery-item.dock-battery-medium,
  .dock-battery-item.dock-battery-medium .dock-battery-fill { color: #f5a623; }
  .dock-battery-item.dock-battery-low,
  .dock-battery-item.dock-battery-low .dock-battery-fill { color: #e5484d; }

  .dock-device-audio-btn {
    width: 22px;
    height: 22px;
    padding: 0;
    border: none;
    border-radius: 999px;
    background: transparent;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: #c5cdd9;
  }

  .dock-device-audio-btn.audio-off { color: #e5484d; }
  .dock-device-audio-btn .sidebar-device-audio-icon {
    width: 14px;
    height: 14px;
  }

  .flyout-row {
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: 40px;
    padding: 8px 14px;
    box-sizing: border-box;
    border: none;
    background: transparent;
    color: inherit;
    font: inherit;
    width: 100%;
    text-align: left;
  }

  .flyout-row + .flyout-row {
    border-top: 1px solid rgba(255, 255, 255, 0.08);
  }

  .flyout-row-battery {
    justify-content: flex-start;
    gap: 12px;
  }

  .flyout-row-battery .dock-battery-icon {
    width: 28px;
    height: 28px;
    flex-shrink: 0;
  }

  .flyout-pct {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.01em;
    line-height: 1;
    color: #f2f5fa;
  }

  .flyout-row-battery.dock-battery-good,
  .flyout-row-battery.dock-battery-good .dock-battery-icon { color: #3ecf6f; }
  .flyout-row-battery.dock-battery-medium,
  .flyout-row-battery.dock-battery-medium .dock-battery-icon { color: #f5a623; }
  .flyout-row-battery.dock-battery-low,
  .flyout-row-battery.dock-battery-low .dock-battery-icon { color: #e5484d; }
  .flyout-row-battery.dock-battery-unknown,
  .flyout-row-battery.dock-battery-unknown .dock-battery-icon { color: #8b93a3; }

  .flyout-row-audio {
    cursor: pointer;
  }

  .flyout-row-audio:hover {
    background: rgba(255, 255, 255, 0.04);
  }

  .flyout-row-audio .sidebar-device-audio-icon {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    color: #c5cdd9;
  }

  .flyout-row-audio.audio-off .sidebar-device-audio-icon {
    color: #e5484d;
  }

  .flyout-row-label {
    font-size: 13px;
    font-weight: 500;
    color: #e8ecf4;
  }

  .flyout-row-wifi {
    justify-content: space-between;
  }

  .flyout-row-main {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }

  .flyout-wifi-icon {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    color: #c5cdd9;
  }

  .sidebar-wifi-toggle {
    display: inline-flex;
    align-items: center;
    margin: 0;
    cursor: pointer;
    position: relative;
    flex-shrink: 0;
  }

  .sidebar-wifi-toggle-input {
    position: absolute;
    opacity: 0;
    width: 0;
    height: 0;
  }

  .sidebar-wifi-toggle-ui {
    display: block;
    width: 34px;
    height: 18px;
    border-radius: 999px;
    background: #3a4150;
    position: relative;
  }

  .sidebar-wifi-toggle-ui::after {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #c8ceda;
    transition: transform 0.18s ease, background 0.18s ease;
  }

  .sidebar-wifi-toggle-input:checked + .sidebar-wifi-toggle-ui {
    background: #3d6df0;
  }

  .sidebar-wifi-toggle-input:checked + .sidebar-wifi-toggle-ui::after {
    transform: translateX(16px);
    background: #fff;
  }

  .sidebar-wifi-toggle-input:disabled + .sidebar-wifi-toggle-ui {
    opacity: 0.45;
    cursor: not-allowed;
  }

  .dock-device-chip .sidebar-wifi-toggle-ui {
    width: 28px;
    height: 14px;
  }

  .dock-device-chip .sidebar-wifi-toggle-ui::after {
    top: 1px;
    left: 1px;
    width: 12px;
    height: 12px;
  }

  .dock-device-chip .sidebar-wifi-toggle-input:checked + .sidebar-wifi-toggle-ui::after {
    transform: translateX(14px);
  }
</style>
</head>
<body>
  <div id="host"></div>
  <script>
    const host = document.getElementById("host");
    let reportTimer = null;
    let mode = "flyout";
    let deviceId = "";
    let serial = "";

    function reportSize() {
      const panel = host.querySelector(".more-panel, .flyout");
      if (!panel) return;
      const rect = panel.getBoundingClientRect();
      window.dockChipFlyoutOverlayAPI?.reportSize?.({
        width: Math.ceil(rect.width),
        height: Math.ceil(rect.height),
        mode
      });
    }

    function chipIds(chip) {
      return {
        deviceId: chip?.dataset?.deviceId || deviceId || "",
        serial: chip?.dataset?.serial || serial || ""
      };
    }

    function bindFlyout(root) {
      const audioBtn = root.querySelector(".dock-device-audio-btn");
      if (audioBtn) {
        audioBtn.addEventListener("click", (event) => {
          event.preventDefault();
          event.stopPropagation();
          void window.dockChipFlyoutOverlayAPI?.toggleAudio?.({ deviceId, serial });
        });
      }

      const wifiInput = root.querySelector(".sidebar-wifi-toggle-input");
      if (wifiInput) {
        wifiInput.addEventListener("click", (event) => event.stopPropagation());
        wifiInput.addEventListener("change", (event) => {
          event.stopPropagation();
          void window.dockChipFlyoutOverlayAPI?.toggleWifi?.({
            deviceId,
            serial,
            checked: Boolean(wifiInput.checked)
          });
        });
      }
    }

    function bindMorePanel(root) {
      root.querySelectorAll(".dock-device-audio-btn").forEach((btn) => {
        btn.addEventListener("click", (event) => {
          event.preventDefault();
          event.stopPropagation();
          const chip = btn.closest(".dock-device-chip");
          void window.dockChipFlyoutOverlayAPI?.toggleAudio?.(chipIds(chip));
        });
      });

      root.querySelectorAll(".sidebar-wifi-toggle-input").forEach((input) => {
        input.addEventListener("click", (event) => event.stopPropagation());
        input.addEventListener("change", (event) => {
          event.stopPropagation();
          const chip = input.closest(".dock-device-chip");
          const ids = chipIds(chip);
          void window.dockChipFlyoutOverlayAPI?.toggleWifi?.({
            ...ids,
            checked: Boolean(input.checked)
          });
        });
      });

      root.querySelectorAll(".dock-device-chip").forEach((chip) => {
        chip.addEventListener("contextmenu", (event) => {
          if (event.target.closest(".sidebar-wifi-toggle, .dock-device-audio-btn")) return;
          event.preventDefault();
          event.stopPropagation();
          const ids = chipIds(chip);
          void window.dockChipFlyoutOverlayAPI?.showColorMenu?.({
            ...ids,
            x: event.screenX,
            y: event.screenY
          });
        });
      });
    }

    window.dockChipFlyoutOverlayAPI?.onRender?.((payload = {}) => {
      if (!payload.visible) {
        host.innerHTML = "";
        host.classList.remove("mode-more");
        return;
      }
      mode = payload.kind === "more" ? "more" : "flyout";
      deviceId = String(payload.deviceId || "");
      serial = String(payload.serial || "");
      host.classList.toggle("mode-more", mode === "more");

      if (mode === "more") {
        host.innerHTML = `<div class="more-panel">${payload.html || ""}</div>`;
        const panel = host.querySelector(".more-panel");
        if (panel) bindMorePanel(panel);
      } else {
        host.innerHTML = `<div class="flyout">${payload.html || ""}</div>`;
        const flyout = host.querySelector(".flyout");
        if (flyout) {
          deviceId = flyout.dataset.deviceId || deviceId;
          serial = flyout.dataset.serial || serial;
          bindFlyout(flyout);
        }
      }

      if (reportTimer) clearTimeout(reportTimer);
      reportTimer = setTimeout(reportSize, 16);
    });

    document.addEventListener("mouseenter", () => {
      window.dockChipFlyoutOverlayAPI?.keepOpen?.();
    });

    document.addEventListener("mouseleave", () => {
      // Le panneau +N se ferme au clic / Escape, pas au leave.
      if (mode === "more") return;
      window.dockChipFlyoutOverlayAPI?.hide?.();
    });
  </script>
</body>
</html>
