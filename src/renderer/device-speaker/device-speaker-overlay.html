<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    font-family: "Segoe UI", system-ui, sans-serif;
  }
  #panel {
    box-sizing: border-box;
    width: 100%;
    height: 100%;
    padding: 12px 12px 10px;
    border-radius: 14px;
    background: rgba(22, 27, 36, 0.97);
    border: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
    color: #e8edf5;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  #title {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: #aeb8c9;
  }
  .row {
    display: grid;
    grid-template-columns: minmax(72px, 1.1fr) 32px minmax(80px, 1.2fr) 32px;
    align-items: center;
    gap: 8px;
    min-height: 36px;
  }
  .row.global {
    padding-bottom: 6px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }
  .row.audio-locked {
    opacity: 0.45;
  }
  .row.audio-locked .mute-btn,
  .row.audio-locked .slider {
    pointer-events: none;
    cursor: not-allowed;
  }
  .lock-hint {
    font-size: 10px;
    color: #8b95a8;
    grid-column: 1 / -1;
    margin-top: -4px;
  }
  .name {
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: #e8edf5;
  }
  .name.global-label {
    color: #aeb8c9;
    font-weight: 600;
    font-size: 11px;
  }
  .mute-btn {
    width: 32px;
    height: 26px;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.14);
    background: rgba(255, 255, 255, 0.06);
    color: #e8edf5;
    cursor: pointer;
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .mute-btn svg {
    width: 16px;
    height: 16px;
    display: block;
  }
  .mute-btn .icon-on,
  .mute-btn .icon-off {
    display: none;
  }
  .mute-btn.on {
    background: rgba(62, 207, 111, 0.16);
    border-color: rgba(62, 207, 111, 0.35);
    color: #3ecf6f;
  }
  .mute-btn.on .icon-on {
    display: block;
  }
  .mute-btn.off {
    background: rgba(229, 72, 77, 0.16);
    border-color: rgba(229, 72, 77, 0.35);
    color: #e5484d;
  }
  .mute-btn.off .icon-off {
    display: block;
  }
  .mute-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .slider {
    width: 100%;
    height: 4px;
    -webkit-appearance: none;
    appearance: none;
    background: rgba(255, 255, 255, 0.16);
    border-radius: 999px;
    outline: none;
    cursor: pointer;
  }
  .slider:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: #6b9fff;
    border: 0;
    cursor: pointer;
  }
  .value {
    font-size: 11px;
    font-weight: 700;
    text-align: right;
    color: #e8edf5;
  }
  #list {
    overflow: auto;
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-height: 0;
    flex: 1;
  }
  .empty {
    font-size: 11px;
    color: #7f8aa0;
    padding: 8px 0;
  }
</style>
</head>
<body>
  <div id="panel">
    <div id="title">Audio</div>
    <div class="row global" id="global-row">
      <div class="name global-label">Volume global</div>
      <button type="button" class="mute-btn off" id="global-mute" data-action="global-mute" title="Audio OFF" aria-label="Audio OFF">
        <svg class="icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M11 5 6 9H2v6h4l5 4V5z"/>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
        </svg>
        <svg class="icon-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M11 5 6 9H2v6h4l5 4V5z"/>
          <path d="m23 9-6 6"/>
          <path d="m17 9 6 6"/>
        </svg>
      </button>
      <input class="slider" id="global-slider" type="range" min="0" max="100" step="1" value="0">
      <div class="value" id="global-value">0</div>
    </div>
    <div id="list"></div>
  </div>
  <script>
    const titleEl = document.getElementById("title");
    const listEl = document.getElementById("list");
    const globalSlider = document.getElementById("global-slider");
    const globalValue = document.getElementById("global-value");
    const globalMuteBtn = document.getElementById("global-mute");
    const timers = new Map();
    let panelState = { devices: [], globalVolume: 0, globalMax: 15, globalMuted: true };
    let savedGlobalPercent = 100;
    /** % UI par device — autoritatif tant que le global ne force pas tout le monde. */
    const deviceVolumeLocal = new Map();
    let rendering = false;

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function deviceRowKey(d) {
      return String(d?.deviceKey || d?.deviceId || d?.serial || "").trim();
    }

    const AUDIO_ICON_ON =
      `<svg class="icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">` +
      `<path d="M11 5 6 9H2v6h4l5 4V5z"/>` +
      `<path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>` +
      `<path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>` +
      `</svg>`;
    const AUDIO_ICON_OFF =
      `<svg class="icon-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">` +
      `<path d="M11 5 6 9H2v6h4l5 4V5z"/>` +
      `<path d="m23 9-6 6"/>` +
      `<path d="m17 9 6 6"/>` +
      `</svg>`;

    function muteButtonHtml(on, deviceKey, locked = false) {
      const state = on ? "on" : "off";
      const label = locked
        ? "Audio : première session uniquement"
        : (on ? "Audio ON" : "Audio OFF");
      return (
        `<button type="button" class="mute-btn ${state}" data-action="mute" data-key="${deviceKey}" title="${label}" aria-label="${label}"${locked ? " disabled" : ""}>` +
        AUDIO_ICON_ON +
        AUDIO_ICON_OFF +
        `</button>`
      );
    }

    function setMuteButtonState(muteBtn, wantOn) {
      if (!muteBtn) return;
      muteBtn.classList.toggle("on", wantOn);
      muteBtn.classList.toggle("off", !wantOn);
      const label = wantOn ? "Audio ON" : "Audio OFF";
      muteBtn.title = label;
      muteBtn.setAttribute("aria-label", label);
    }

    /** Global uniquement : aligne TOUS les devices sur le même %. */
    function applyDevicePercents(percent) {
      const p = Math.max(0, Math.min(100, Math.round(Number(percent) || 0)));
      const wantOn = p > 0;
      if (wantOn) savedGlobalPercent = p;
      setMuteButtonState(globalMuteBtn, wantOn);
      deviceVolumeLocal.clear();
      listEl.querySelectorAll(".row").forEach((row) => {
        const slider = row.querySelector("input[data-action='volume']");
        if (!slider) return;
        const key = slider.getAttribute("data-key") || row.getAttribute("data-key") || "";
        if (key) deviceVolumeLocal.set(key, p);
        slider.value = String(p);
        const valueEl = row.querySelector(".value");
        if (valueEl) valueEl.textContent = String(p);
        setMuteButtonState(row.querySelector("[data-action='mute']"), wantOn);
      });
      if (panelState?.devices) {
        panelState.devices = panelState.devices.map((d) => {
          const key = deviceRowKey(d);
          if (key) deviceVolumeLocal.set(key, p);
          return { ...d, percent: p, audioOn: wantOn };
        });
      }
      panelState.globalVolume = p;
      panelState.globalMuted = !wantOn;
    }

    function resolveDevicePercent(d, panel, editingDevice = null, keepDeviceValue = null) {
      const key = deviceRowKey(d);
      // Pendant un drag sur CE slider : garder la valeur locale.
      if (editingDevice && key === editingDevice && keepDeviceValue != null) {
        return Math.max(0, Math.min(100, Math.round(Number(keepDeviceValue) || 0)));
      }
      // Sinon le panel main est la source de vérité (évite cache local bloqué à 0 %).
      if (Number.isInteger(d.percent)) {
        if (key) deviceVolumeLocal.set(key, d.percent);
        return d.percent;
      }
      if (key && deviceVolumeLocal.has(key)) {
        return deviceVolumeLocal.get(key);
      }
      return 0;
    }

    function applyPanel(panel, { preserveDeviceFocus = false } = {}) {
      if (!panel) return;
      const active = document.activeElement;
      const editingDevice = preserveDeviceFocus
        && active?.getAttribute?.("data-action") === "volume"
        && active.getAttribute("data-key");
      const editingGlobal = active === globalSlider;
      const keepDeviceValue = editingDevice ? active.value : null;
      const keepGlobalValue = editingGlobal ? active.value : null;

      if (panel._scope === "global") {
        deviceVolumeLocal.clear();
      }
      // Resync cache depuis le panel (sauf le slider en cours d'édition).
      for (const d of (panel.devices || [])) {
        const key = deviceRowKey(d);
        if (!key || !Number.isInteger(d.percent)) continue;
        if (editingDevice && key === editingDevice) continue;
        deviceVolumeLocal.set(key, d.percent);
      }
      if (panel._scope === "device" && panel._changedKey) {
        const changed = (panel.devices || []).find((d) => deviceRowKey(d) === panel._changedKey);
        if (changed && Number.isInteger(changed.percent)) {
          deviceVolumeLocal.set(panel._changedKey, changed.percent);
          const rowKey = deviceRowKey(changed);
          if (rowKey) deviceVolumeLocal.set(rowKey, changed.percent);
        }
      }

      panelState = panel;
      const gVolRaw = Number.isInteger(panel.globalVolume) ? panel.globalVolume : 0;
      let gVol = gVolRaw;
      if (panel._scope === "device") {
        const currentUi = Number(globalSlider.value);
        if (gVolRaw <= 0 && currentUi > 0) {
          gVol = currentUi;
        } else if (gVolRaw <= 0 && savedGlobalPercent > 0 && !panel.globalMuted) {
          gVol = savedGlobalPercent;
        }
      }
      const globalOn = !panel.globalMuted && (gVol > 0 || (panel.devices || []).some((d) => d.audioOn));
      if (gVol > 0) savedGlobalPercent = gVol;
      globalSlider.max = "100";
      if (!editingGlobal) {
        if (panel._scope !== "device" || gVolRaw > 0) {
          globalSlider.value = String(gVol);
          globalValue.textContent = String(gVol);
        }
      }
      setMuteButtonState(globalMuteBtn, globalOn);
      const globalEnabled = panel.globalControlsEnabled !== false && (panel.devices || []).length > 0;
      globalMuteBtn.disabled = !globalEnabled;
      globalSlider.disabled = !globalEnabled;

      const devices = Array.isArray(panel.devices) ? panel.devices : [];
      if (!devices.length) {
        listEl.innerHTML = `<div class="empty">Aucun appareil connecté</div>`;
        return;
      }

      listEl.innerHTML = devices.map((d) => {
        const key = escapeHtml(deviceRowKey(d));
        const name = escapeHtml(d.name || d.serial || "Device");
        const percent = resolveDevicePercent(d, panel, editingDevice, keepDeviceValue);
        const on = percent > 0 && d.audioOn !== false;
        return (
          `<div class="row" data-key="${key}" data-locked="0">` +
          `<div class="name" title="${name}">${name}</div>` +
          muteButtonHtml(on, key, false) +
          `<input class="slider" data-action="volume" data-key="${key}" data-adb="${escapeHtml(d.adbSerial || "")}" type="range" min="0" max="100" step="1" value="${percent}">` +
          `<div class="value">${percent}</div>` +
          `</div>`
        );
      }).join("");

      if (editingGlobal) {
        globalSlider.focus();
        if (keepGlobalValue != null) {
          globalSlider.value = keepGlobalValue;
          globalValue.textContent = String(keepGlobalValue);
        }
      } else if (editingDevice) {
        const safe = String(editingDevice).replace(/\\/g, "\\\\").replace(/"/g, '\\"');
        const el = listEl.querySelector(`input[data-action='volume'][data-key="${safe}"]`);
        if (el) {
          el.focus();
          if (keepDeviceValue != null) {
            el.value = keepDeviceValue;
            const valueEl = el.closest(".row")?.querySelector(".value");
            if (valueEl) valueEl.textContent = String(keepDeviceValue);
          }
        }
      }
    }

    function schedule(key, fn) {
      if (timers.has(key)) clearTimeout(timers.get(key));
      timers.set(key, setTimeout(() => {
        timers.delete(key);
        void fn();
      }, 40));
    }

    listEl.addEventListener("click", (event) => {
      const btn = event.target.closest("[data-action='mute']");
      if (!btn || btn.disabled || btn.classList.contains("pending")) return;
      const row = btn.closest(".row");
      if (row?.getAttribute("data-locked") === "1") return;
      const deviceKey = btn.getAttribute("data-key");
      if (!deviceKey) return;
      btn.classList.add("pending");
      btn.disabled = true;
      // Intention AVANT flip optimiste : OFF si bouton actuellement ON.
      const wantOff = btn.classList.contains("on");
      const next = wantOff ? 0 : 100;
      if (deviceKey) deviceVolumeLocal.set(deviceKey, next);
      setMuteButtonState(btn, !wantOff);
      const slider = row?.querySelector("input[data-action='volume']");
      const valueEl = row?.querySelector(".value");
      if (slider) slider.value = String(next);
      if (valueEl) valueEl.textContent = String(next);
      void window.deviceSpeakerOverlayAPI?.toggleDeviceAudio?.({ deviceKey, wantOff })
        .catch((err) => console.error("[device-speaker] toggleDeviceAudio:", err))
        .finally(() => {
          btn.classList.remove("pending");
          btn.disabled = false;
        });
    });

    globalMuteBtn.addEventListener("click", () => {
      if (globalMuteBtn.disabled) return;
      cancelPendingGlobal();
      // Optimistic UI ; le main applique la même logique que le clic dock.
      const currentlyOn = globalMuteBtn.classList.contains("on")
        || (Number(globalSlider.value) > 0 && !panelState?.globalMuted);
      if (currentlyOn) {
        const cur = Number(globalSlider.value);
        if (cur > 0) savedGlobalPercent = cur;
        globalSlider.value = "0";
        globalValue.textContent = "0";
        applyDevicePercents(0);
      } else {
        const restore = 100;
        globalSlider.value = String(restore);
        globalValue.textContent = String(restore);
        applyDevicePercents(restore);
      }
      void window.deviceSpeakerOverlayAPI?.toggleGlobalAudio?.();
    });

    function cancelPendingGlobal() {
      if (timers.has("global")) {
        clearTimeout(timers.get("global"));
        timers.delete("global");
      }
    }

    listEl.addEventListener("input", (event) => {
      const slider = event.target.closest("input[data-action='volume']");
      if (!slider || slider.disabled) return;
      const row = slider.closest(".row");
      if (row?.getAttribute("data-locked") === "1") return;
      cancelPendingGlobal();
      const deviceKey = slider.getAttribute("data-key");
      const adbSerial = slider.getAttribute("data-adb") || "";
      const percent = Number(slider.value);
      const valueEl = row?.querySelector(".value");
      if (valueEl) valueEl.textContent = String(percent);
      const wantOn = percent > 0;
      if (deviceKey) deviceVolumeLocal.set(deviceKey, percent);
      if (panelState?.devices) {
        panelState.devices = panelState.devices.map((d) => {
          const key = deviceRowKey(d);
          return key === deviceKey ? { ...d, percent, audioOn: wantOn } : d;
        });
      }
      // Uniquement CE device — pas les autres lignes.
      setMuteButtonState(row?.querySelector("[data-action='mute']"), wantOn);
      schedule(`vol:${deviceKey}`, () => {
        slider.setAttribute("data-last-sent", String(percent));
        void window.deviceSpeakerOverlayAPI?.setVolume?.({
          deviceKey,
          adbSerial,
          percent
        });
      });
    });

    listEl.addEventListener("change", (event) => {
      const slider = event.target.closest("input[data-action='volume']");
      if (!slider) return;
      cancelPendingGlobal();
      const deviceKey = slider.getAttribute("data-key");
      const adbSerial = slider.getAttribute("data-adb") || "";
      const percent = Number(slider.value);
      const row = slider.closest(".row");
      const valueEl = row?.querySelector(".value");
      if (valueEl) valueEl.textContent = String(percent);
      const wantOn = percent > 0;
      if (deviceKey) deviceVolumeLocal.set(deviceKey, percent);
      if (panelState?.devices) {
        panelState.devices = panelState.devices.map((d) => {
          const key = deviceRowKey(d);
          return key === deviceKey ? { ...d, percent, audioOn: wantOn } : d;
        });
      }
      setMuteButtonState(row?.querySelector("[data-action='mute']"), wantOn);
      // Si un debounce input est déjà en route pour le même %, il suffit.
      // Sinon (clic direct / release sans input récent) : appliquer maintenant.
      const key = `vol:${deviceKey}`;
      if (timers.has(key)) {
        clearTimeout(timers.get(key));
        timers.delete(key);
      }
      const lastSent = Number(slider.getAttribute("data-last-sent"));
      if (lastSent === percent) return;
      slider.setAttribute("data-last-sent", String(percent));
      void window.deviceSpeakerOverlayAPI?.setVolume?.({
        deviceKey,
        adbSerial,
        percent
      });
    });

    globalSlider.addEventListener("input", () => {
      const percent = Number(globalSlider.value);
      globalValue.textContent = String(percent);
      applyDevicePercents(percent);
      schedule("global", () => {
        globalSlider.setAttribute("data-last-sent", String(percent));
        void window.deviceSpeakerOverlayAPI?.setGlobalVolume?.({ percent });
      });
    });

    globalSlider.addEventListener("change", () => {
      const percent = Number(globalSlider.value);
      globalValue.textContent = String(percent);
      applyDevicePercents(percent);
      if (timers.has("global")) {
        clearTimeout(timers.get("global"));
        timers.delete("global");
      }
      const lastSent = Number(globalSlider.getAttribute("data-last-sent"));
      if (lastSent === percent) return;
      globalSlider.setAttribute("data-last-sent", String(percent));
      void window.deviceSpeakerOverlayAPI?.setGlobalVolume?.({ percent });
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") window.deviceSpeakerOverlayAPI?.hide?.();
    });

    window.deviceSpeakerOverlayAPI?.onRender?.((payload) => {
      if (payload?.title) titleEl.textContent = payload.title;
      applyPanel(payload?.panel);
    });

    window.deviceSpeakerOverlayAPI?.onPanel?.((panel) => {
      applyPanel(panel, { preserveDeviceFocus: true });
    });
  </script>
</body>
</html>
