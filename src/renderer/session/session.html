<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><style>
html,body{margin:0;padding:0;overflow:hidden;background:#000;width:100%;height:100%;}
body{display:flex;align-items:stretch;justify-content:stretch;}
.session-zoom-viewport{width:100%;height:100%;position:relative;background:#000;}
.session-zoom-viewport.portrait-centered{
  display:flex;align-items:center;justify-content:center;
}
#video-canvas{display:block;object-fit:contain;}
html:not([data-portrait-display="1"]) #video-canvas{width:100%;height:100%;}
html[data-portrait-display="1"] #video-canvas{
  width:auto;height:auto;max-width:100%;max-height:100%;margin:auto;
}
html[data-portrait-display="1"] #video-canvas.portrait-interim{
  width:auto!important;height:auto!important;max-width:100%;max-height:100%;
  transform:rotate(90deg);transform-origin:center center;
}
#session-video-element{
  display:none;position:absolute;left:0;top:0;pointer-events:none;background:#000;z-index:0;
  object-fit:contain;
}
html[data-yume-renderer="1"] #session-video-element{display:block;}
html[data-yume-renderer="1"] #video-canvas{position:relative;z-index:1;opacity:0;}
#session-file-drop-overlay{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.45);pointer-events:none;z-index:8;
}
#session-file-drop-overlay.is-visible{pointer-events:auto;}
#session-file-drop-overlay[hidden]{display:none!important;}
.session-file-drop-card{
  border:1px dashed rgba(255,255,255,.45);border-radius:14px;padding:18px 22px;
  color:#fff;font:600 14px/1.4 "Segoe UI",sans-serif;background:rgba(20,24,32,.75);
}
</style>
<script>
  (function applySessionVideoFitPref() {
    document.documentElement.dataset.videoFit = "contain";
  })();
</script>
</head>
<body>
<canvas id="video-canvas"></canvas>
<div id="session-file-drop-overlay" hidden>
  <div class="session-file-drop-card">
    <span class="session-file-drop-label">Déposer pour envoyer vers Téléchargements</span>
  </div>
</div>
<script src="./session-wheel-zoom.js"></script>
<script src="./session-file-drop.js"></script>
<script src="./session.js"></script>
</body>
</html>
