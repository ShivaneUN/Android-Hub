<script>
  if (globalThis.AppName) globalThis.AppName.setWindowTitle();

  document.getElementById('btn-min').addEventListener('click', () => {
    if (window.electronAPI) window.electronAPI.minimize();
  });
  document.getElementById('btn-max').addEventListener('click', () => {
    if (window.electronAPI) window.electronAPI.maximize();
  });
  document.getElementById('btn-close').addEventListener('click', () => {
    if (window.electronAPI) window.electronAPI.close();
  });

  document.getElementById('titlebar-version')?.addEventListener('click', () => {
    openSettingsPanelFromMain?.('updates');
  });

  (function initTitlebarVersionBadge() {
    const versionBtn = document.getElementById('titlebar-version');
    if (!versionBtn || !window.electronAPI) return;
    const t = (key, vars) => globalThis.HubI18n?.t(key, vars) ?? key;

    function renderBadge(state = {}) {
      versionBtn.textContent = t('titlebar.version', { version: state.currentVersion || '?' });
      const hasUpdate = state.status === 'available' || state.status === 'downloaded';
      versionBtn.classList.toggle('has-update', hasUpdate);
    }

    window.electronAPI.onUpdateStatus(renderBadge);
    window.electronAPI.updateGetStatus?.().then(renderBadge).catch(() => {});
    globalThis.HubI18n?.onChange?.(() => {
      window.electronAPI.updateGetStatus?.().then(renderBadge).catch(() => {});
    });
  })();

  const navButtons = {
    "nav-new-session": "page-new-session",
    "nav-settings": "page-settings-panel"
  };

  document.getElementById("tabs-new-instance")?.addEventListener("click", async () => {
    document.querySelectorAll(".sidebar-item").forEach(el => el.classList.remove("active"));
    document.getElementById("nav-new-session")?.classList.add("active");
    await openNewSessionPanelFromMain();
  });

  (function syncTabsNewInstanceTip() {
    const btn = document.getElementById("tabs-new-instance");
    if (!btn) return;
    const apply = () => {
      const label = globalThis.HubI18n?.t?.("sidebar.newInstance") || "Nouvelle instance";
      btn.removeAttribute("title");
      btn.dataset.dockTip = label;
      btn.setAttribute("aria-label", label);
    };
    apply();
    globalThis.HubI18n?.onChange?.(apply);
  })();

  Object.keys(navButtons).forEach(navId => {
    document.getElementById(navId).addEventListener("click", async () => {
      document.querySelectorAll(".sidebar-item").forEach(el => el.classList.remove("active"));
      document.getElementById(navId).classList.add("active");
      if (navId === "nav-new-session") {
        await openNewSessionPanelFromMain();
        return;
      }
      if (navId === "nav-settings") {
        await openSettingsPanelFromMain("devices");
        return;
      }
      await openHubModal(navButtons[navId]);
    });
  });

  document.getElementById("nav-aide")?.addEventListener("click", () => {
    document.querySelectorAll(".sidebar-item").forEach(el => el.classList.remove("active"));
    document.getElementById("nav-aide")?.classList.add("active");
    openHelpPanel("shortcuts");
  });

  async function goToLaunchHome() {
    window.__hubShowingHome = true;

    try {
      window.dockHoverAPI?.hide?.();
      document.getElementById("quick-actions-dock")?.classList.remove("dock-covered");

      if (window.getStreamDeckMode?.() === true && typeof window.setStreamDeckMode === "function") {
        window.setStreamDeckMode(false);
      }

      document.querySelectorAll(".scrcpy-tab").forEach((tab) => tab.classList.remove("active"));
      document.querySelectorAll(".sidebar-item").forEach((el) => el.classList.remove("active"));
      document.getElementById("nav-home")?.classList.add("active");

      const content = document.querySelector(".content");
      if (content) {
        content.classList.remove("content--session-view", "content--stream-deck", "content--portrait-view", "content--session-focused");
      }

      const streamDeckShell = document.getElementById("stream-deck-shell");
      if (streamDeckShell) streamDeckShell.classList.add("hidden");

      document.querySelectorAll(".content > .page").forEach((page) => page.classList.add("hidden"));
      document.getElementById("page-new")?.classList.remove("hidden");

      if (window.sessionAPI?.suppressView) {
        await window.sessionAPI.suppressView();
      }

      if (typeof window.invalidateVideoLayoutBoundsCache === "function") {
        window.invalidateVideoLayoutBoundsCache();
      }
      if (typeof window.syncDockBatteries === "function") {
        void window.syncDockBatteries();
      }
    } catch (err) {
      console.error("[goToLaunchHome]", err);
    }
  }

  window.goToLaunchHome = goToLaunchHome;

  document.getElementById("nav-home")?.addEventListener("click", () => {
    void goToLaunchHome();
  });

</script>

<script>
  (function initUiThemeToggle() {
    const STORAGE_KEY = "androidHub.uiTheme";
    const body = document.body;

    function placeDock(theme) {
      const dock = document.getElementById("quick-actions-dock");
      const aide = document.getElementById("nav-aide");
      const lang = document.getElementById("nav-language");
      const sidebar = document.getElementById("sidebar");
      const shell = document.getElementById("sidebar-shell");
      if (!dock || !sidebar || !shell) return;

      if (theme === "tablet") {
        shell.insertAdjacentElement("afterend", dock);
        // Langue toujours dans le dock (jamais hors du rail / hors du dock).
        if (lang && !dock.contains(lang)) {
          const settings = document.getElementById("nav-settings");
          if (settings && dock.contains(settings)) settings.insertAdjacentElement("afterend", lang);
          else dock.appendChild(lang);
        }
        if (aide) dock.insertAdjacentElement("afterend", aide);
      } else {
        if (aide) {
          if (lang && dock.contains(lang)) dock.insertBefore(aide, lang);
          else if (!dock.contains(aide)) dock.appendChild(aide);
        }
        const spacer = sidebar.querySelector(".sidebar-spacer");
        if (spacer) spacer.insertAdjacentElement("afterend", dock);
        else sidebar.appendChild(dock);
      }
    }

    function applyTheme(theme) {
      body.classList.toggle("theme-tablet", theme === "tablet");
      placeDock(theme);
      document.querySelectorAll(".ui-theme-option").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.theme === theme);
      });
      if (theme !== "tablet") {
        window.dockHoverAPI?.hide?.();
        document.getElementById("quick-actions-dock")?.classList.remove("dock-covered");
      }
      if (typeof window.invalidateVideoLayoutBoundsCache === "function") {
        window.invalidateVideoLayoutBoundsCache();
      }
      if (typeof window.reportContentBounds === "function") {
        void window.reportContentBounds();
      }
      if (typeof window.syncDockBatteries === "function") {
        void window.syncDockBatteries();
      }
    }

    function getCurrentTheme() {
      try {
        return localStorage.getItem(STORAGE_KEY) === "tablet" ? "tablet" : "classic";
      } catch (_err) {
        return "classic";
      }
    }

    applyTheme(getCurrentTheme());

    // Re-place après création du bouton langue (DOMContentLoaded).
    document.addEventListener("DOMContentLoaded", () => {
      placeDock(getCurrentTheme());
      const pageNew = document.getElementById("page-new");
      if (pageNew && !document.querySelector(".content.content--session-view")) {
        pageNew.classList.remove("hidden");
      }
    });

    (function bindDockHoverOverlay() {
      const dock = document.getElementById("quick-actions-dock");
      if (!dock || dock.dataset.dockHoverBound === "1") return;
      dock.dataset.dockHoverBound = "1";

      const SCALE = 1.55;
      const BASE_H = 36;
      const TIP_SPACE = 34;

      dock.addEventListener("mouseenter", () => {
        if (!body.classList.contains("theme-tablet")) return;
        if (!window.dockHoverAPI?.show) return;

        const rect = dock.getBoundingClientRect();
        const height = Math.round(BASE_H * SCALE) + TIP_SPACE;
        const width = Math.round(Math.max(rect.width, 180) * SCALE);
        const x = rect.left + (rect.width - width) / 2;
        const y = Math.max(0, rect.bottom - height);

        dock.classList.add("dock-covered");
        const clone = dock.cloneNode(true);
        clone.classList.remove("dock-covered");
        void window.dockHoverAPI.show({
          x,
          y,
          width,
          height,
          html: clone.outerHTML
        });
      });
    })();

    document.querySelectorAll(".ui-theme-option").forEach(btn => {
      btn.addEventListener("click", () => {
        const theme = btn.dataset.theme;
        try { localStorage.setItem(STORAGE_KEY, theme); } catch (_err) {}
        applyTheme(theme);
      });
    });
  })();
</script>
